name: Build NimbusLine VPN
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
      - name: Fetch Xray Android binding
        run: |
          mkdir -p app/libs
          curl -L --fail -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.31/libv2ray.aar
          sha256sum app/libs/libv2ray.aar
          test -s app/libs/libv2ray.aar
      - name: Build
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nimbusline-vpn-debug
          path: app/build/outputs/apk/debug/*.apk
